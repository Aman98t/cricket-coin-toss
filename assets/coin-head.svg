<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 500 500"
>
    <defs>

        <!-- Main metallic gold -->
        <radialGradient
            id="headGold"
            cx="32%"
            cy="25%"
            r="75%"
        >
            <stop offset="0%" stop-color="#fff6b5"/>
            <stop offset="22%" stop-color="#f8dc68"/>
            <stop offset="50%" stop-color="#e2b83d"/>
            <stop offset="78%" stop-color="#b77b17"/>
            <stop offset="100%" stop-color="#704207"/>
        </radialGradient>

        <!-- Inner surface -->
        <radialGradient
            id="headInner"
            cx="35%"
            cy="30%"
            r="70%"
        >
            <stop offset="0%" stop-color="#ffe991"/>
            <stop offset="45%" stop-color="#e5b83c"/>
            <stop offset="100%" stop-color="#9a6410"/>
        </radialGradient>

        <!-- Text gradient -->
        <linearGradient
            id="headText"
            x1="0%"
            y1="0%"
            x2="0%"
            y2="100%"
        >
            <stop offset="0%" stop-color="#6b3c05"/>
            <stop offset="50%" stop-color="#8b5709"/>
            <stop offset="100%" stop-color="#4c2a03"/>
        </linearGradient>

        <!-- Outer shadow -->
        <filter
            id="headShadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%"
        >
            <feDropShadow
                dx="0"
                dy="12"
                stdDeviation="9"
                flood-color="#000000"
                flood-opacity="0.35"
            />
        </filter>

    </defs>


    <!-- =================================================
         OUTER COIN
    ================================================== -->

    <circle
        cx="250"
        cy="250"
        r="232"
        fill="url(#headGold)"
        stroke="#674006"
        stroke-width="12"
        filter="url(#headShadow)"
    />


    <!-- =================================================
         INNER RIM
    ================================================== -->

    <circle
        cx="250"
        cy="250"
        r="204"
        fill="none"
        stroke="#ffe58a"
        stroke-width="5"
        opacity="0.9"
    />

    <circle
        cx="250"
        cy="250"
        r="190"
        fill="url(#headInner)"
        stroke="#9b6512"
        stroke-width="3"
    />


    <!-- =================================================
         DECORATIVE RING
    ================================================== -->

    <circle
        cx="250"
        cy="250"
        r="172"
        fill="none"
        stroke="#f8d96b"
        stroke-width="3"
        stroke-dasharray="3 11"
        opacity="0.85"
    />


    <!-- =================================================
         DECORATIVE MARKERS
    ================================================== -->

    <g
        fill="#754707"
        opacity="0.75"
    >

        <circle cx="250" cy="105" r="5"/>
        <circle cx="250" cy="395" r="5"/>
        <circle cx="105" cy="250" r="5"/>
        <circle cx="395" cy="250" r="5"/>

    </g>


    <!-- =================================================
         HEAD SYMBOL
         Cricket player / helmet inspired emblem
    ================================================== -->

    <!-- Head/helmet -->
    <path
        d="
            M 190 190
            C 190 145 215 122 250 122
            C 285 122 310 145 310 190
            L 310 205
            L 292 205
            L 292 180
            C 292 158 276 145 250 145
            C 224 145 208 158 208 180
            L 208 205
            L 190 205
            Z
        "
        fill="#8b5709"
    />

    <!-- Helmet grill -->
    <path
        d="
            M 210 190
            L 290 190
            M 215 202
            L 285 202
            M 222 214
            L 278 214
        "
        fill="none"
        stroke="#f4d46a"
        stroke-width="5"
        stroke-linecap="round"
    />

    <!-- Small helmet visor -->
    <path
        d="
            M 198 176
            Q 250 158 302 176
        "
        fill="none"
        stroke="#f4d46a"
        stroke-width="6"
        stroke-linecap="round"
    />


    <!-- =================================================
         HEAD TEXT
    ================================================== -->

    <text
        x="250"
        y="315"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="900"
        letter-spacing="8"
        fill="url(#headText)"
    >
        HEAD
    </text>


    <!-- =================================================
         LOWER DECORATION
    ================================================== -->

    <path
        d="M 155 350 Q 250 385 345 350"
        fill="none"
        stroke="#7a4a08"
        stroke-width="4"
        opacity="0.7"
    />


    <!-- =================================================
         HIGHLIGHT
    ================================================== -->

    <ellipse
        cx="185"
        cy="130"
        rx="68"
        ry="23"
        fill="#ffffff"
        opacity="0.16"
        transform="rotate(-25 185 130)"
    />

</svg>